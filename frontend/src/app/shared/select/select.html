<div #origin class="relative block">
  <div
    class="mb-1 flex items-center gap-2 font-medium text-content-secondary"
    [class.text-xs]="labelSize() === 'small'"
    [class.text-sm]="labelSize() === 'medium'"
  >
    <span>{{ label() }}</span>
    @if (isChanged()) {
      <span
        class="rounded bg-brand px-1.5 py-0.5 text-xs font-semibold tracking-wide text-on-brand"
      >
        {{ changedLabel() }}
      </span>
    }
  </div>
  <button
    #combobox="ngCombobox"
    ngCombobox
    type="button"
    [expanded]="expanded()"
    (expandedChange)="onExpandedChange($event)"
    [disabled]="disabled() || readonly()"
    [readonly]="readonly()"
    [tabindex]="readonly() ? -1 : undefined"
    [attr.aria-label]="label() + (selectedLabel() ? ': ' + selectedLabel() : '')"
    [attr.aria-required]="required()"
    [attr.aria-invalid]="invalid()"
    class="inline-flex h-control w-full items-center justify-between gap-2 rounded-control border border-border-strong bg-surface px-3 text-left text-control text-content-secondary outline-none hover:bg-surface-subtle focus:border-focus disabled:cursor-not-allowed"
    [class.bg-surface-muted]="readonly()"
    [class.cursor-not-allowed]="readonly()"
    [class.opacity-50]="disabled()"
    (mousedown)="preventReadonlyFocus($event)"
    (blur)="touch.emit()"
  >
    <span class="min-w-0 flex-1 truncate" [class.text-content-subtle]="!selectedLabel()">
      {{ selectedLabel() || placeholder() }}
    </span>
    <app-icon class="text-content-muted" name="chevron-down" [size]="16" />
  </button>
  @if (isChanged()) {
    <span class="mt-1 block text-xs text-content-muted">
      {{ previousValueLabel() }}: {{ originalLabel() }}
    </span>
  }

  <ng-template
    [cdkConnectedOverlay]="{ origin, usePopover: 'inline', matchWidth: true }"
    [cdkConnectedOverlayOpen]="expanded()"
    [cdkConnectedOverlayPositions]="overlayPositions()"
    [cdkConnectedOverlayPush]="true"
    [cdkConnectedOverlayViewportMargin]="8"
    (overlayOutsideClick)="close()"
  >
    <ng-template ngComboboxPopup [combobox]="combobox">
      <div class="w-full rounded-control border border-border bg-surface p-1">
        <div
          #listbox="ngListbox"
          ngListbox
          ngComboboxWidget
          focusMode="activedescendant"
          selectionMode="explicit"
          [tabindex]="-1"
          [activeDescendant]="listbox.activeDescendant()"
          [value]="selectedValues()"
          (valueChange)="selectOption($event)"
          class="max-h-64 overflow-y-auto outline-none"
        >
          @for (option of options(); track option.value) {
            <div
              ngOption
              [value]="option.value"
              [label]="option.label"
              [disabled]="option.disabled ?? false"
              class="flex min-h-10 cursor-pointer items-center gap-2 rounded-control px-3 py-2 text-control text-content-secondary hover:bg-surface-subtle data-[active=true]:bg-surface-muted"
              [class.bg-brand-subtle]="value() === option.value"
              [class.text-brand-strong]="value() === option.value"
            >
              <span class="min-w-0 flex-1 truncate">{{ option.label }}</span>
              @if (value() === option.value) {
                <app-icon class="text-brand-strong" name="check" [size]="16" />
              }
            </div>
          }
        </div>
      </div>
    </ng-template>
  </ng-template>
</div>
