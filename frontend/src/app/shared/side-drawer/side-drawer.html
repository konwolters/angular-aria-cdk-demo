<ng-template #dialogContent>
  <aside class="flex h-dvh flex-col border-l border-border bg-surface p-6">
    <header class="flex items-center justify-between gap-3">
      <h2 [id]="titleId" class="text-lg font-semibold">{{ title() }}</h2>
      <ng-content select="[dialog-header]" />
      <button
        appButton
        type="button"
        variant="ghost"
        size="small"
        icon="close"
        aria-label="Drawer schließen"
        (click)="requestClose()"
      ></button>
    </header>
    <div class="min-h-0 flex-1 overflow-y-auto"><ng-content /></div>
    <footer><ng-content select="[dialog-footer]" /></footer>
  </aside>
</ng-template>
