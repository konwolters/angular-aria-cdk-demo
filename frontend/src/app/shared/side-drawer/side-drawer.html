@if (open()) {
  <div class="fixed inset-0 z-40 bg-overlay" (click)="close()">
    <aside
      role="dialog"
      aria-modal="true"
      aria-labelledby="drawer-title"
      class="absolute inset-y-0 right-0 w-full max-w-xl overflow-y-auto border-l border-border bg-surface p-6"
      cdkTrapFocus
      [cdkTrapFocusAutoCapture]="true"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-center justify-between">
        <h2 id="drawer-title" class="text-lg font-semibold">{{ title() }}</h2>
        <button
          appButton
          type="button"
          variant="ghost"
          size="small"
          icon="close"
          aria-label="Drawer schließen"
          (click)="close()"
        ></button>
      </div>
      <ng-content />
    </aside>
  </div>
}
