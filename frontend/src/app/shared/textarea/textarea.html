<app-field-wrapper
  [label]="label()"
  [hideLabel]="hideLabel()"
  [required]="required()"
  [changed]="isChanged()"
  [changedLabel]="changedLabel()"
  [previousValueLabel]="previousValueLabel()"
  [previousValue]="originalValue()"
  [messagesId]="messagesId"
  [hint]="hint()"
  [errors]="errors()"
  [showErrors]="invalid() && touched() && !readonly()"
  [controlId]="messagesId + '-control'"
>
  <textarea
    [id]="messagesId + '-control'"
    [value]="value()"
    [placeholder]="placeholder()"
    [rows]="rows()"
    [disabled]="disabled()"
    [attr.maxlength]="maxLength()"
    [attr.aria-describedby]="messagesId"
    [readonly]="readonly()"
    [required]="required()"
    [tabindex]="readonly() ? -1 : null"
    [attr.aria-invalid]="invalid() ? 'true' : null"
    class="mt-1 w-full resize-y rounded-control border border-border-strong p-3 text-control font-normal text-content-secondary shadow-sm outline-none placeholder:text-content-subtle focus:border-focus"
    [class.min-h-20]="size() === 'small'"
    [class.min-h-28]="size() === 'medium'"
    [class.bg-surface]="!readonly()"
    [class.bg-surface-muted]="readonly()"
    [class.cursor-not-allowed]="readonly()"
    [class.opacity-50]="disabled()"
    (input)="updateValue($event)"
    (blur)="touch.emit()"
  ></textarea>
</app-field-wrapper>
