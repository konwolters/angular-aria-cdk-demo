<form class="flex flex-wrap items-end gap-3 border-b border-border p-5" (submit)="submit($event)">
  <ng-content select="[data-table-searches]" />

  <ng-content select="[data-table-filters]" />

  <ng-content select="[data-table-actions]" />
  <button appButton type="submit" variant="primary" [disabled]="applyDisabled()">Suchen</button>

  @if (showReset()) {
    <button appButton type="button" variant="secondary" icon="refresh" (click)="resetFilters()">
      {{ resetLabel() }}
    </button>
  }
  <div class="basis-full text-xs text-content-muted empty:hidden">
    <ng-content select="[data-table-summary]" />
  </div>
</form>
