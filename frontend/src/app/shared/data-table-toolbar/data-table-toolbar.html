<form
  class="flex flex-wrap items-end gap-3 border-b border-border px-5 pb-5"
  [class.pt-1]="compactTop()"
  [class.pt-5]="!compactTop()"
  (submit)="submit($event)"
>
  <ng-content select="[data-table-searches]" />

  <ng-content select="[data-table-filters]" />

  <ng-content select="[data-table-actions]" />
  @if (showApply()) {
    <button
      appButton
      type="submit"
      variant="primary"
      [size]="buttonSize()"
      [disabled]="applyDisabled()"
    >
      Suchen
    </button>
  }

  @if (showReset()) {
    <button
      appButton
      type="button"
      variant="secondary"
      [size]="buttonSize()"
      icon="refresh"
      (click)="resetFilters()"
    >
      {{ resetLabel() }}
    </button>
  }
  <div class="basis-full text-xs text-content-muted empty:hidden">
    <ng-content select="[data-table-summary]" />
  </div>
</form>
