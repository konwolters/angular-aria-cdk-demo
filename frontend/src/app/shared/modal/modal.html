@if (open()) {
  <div class="fixed inset-0 z-40 grid place-items-center bg-overlay p-4" (click)="close()">
    <section
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
      class="w-full max-w-md rounded-dialog border border-border bg-surface p-6"
      cdkTrapFocus
      [cdkTrapFocusAutoCapture]="true"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-start justify-between">
        <h2 id="modal-title" class="text-lg font-semibold">{{ title() }}</h2>
        <button
          appButton
          type="button"
          variant="ghost"
          size="small"
          icon="close"
          aria-label="Dialog schließen"
          (click)="close()"
        ></button>
      </div>
      <ng-content />
    </section>
  </div>
}
