<ng-template #dialogContent>
  <section class="max-h-[95dvh] overflow-y-auto rounded-dialog border border-border bg-surface p-6">
    <header class="flex items-start justify-between gap-3">
      <h2 [id]="titleId" class="text-lg font-semibold">{{ title() }}</h2>
      <ng-content select="[dialog-header]" />
      <button
        appButton
        type="button"
        variant="ghost"
        size="small"
        icon="close"
        aria-label="Dialog schließen"
        (click)="requestClose()"
      ></button>
    </header>
    <ng-content />
    <footer><ng-content select="[dialog-footer]" /></footer>
  </section>
</ng-template>
