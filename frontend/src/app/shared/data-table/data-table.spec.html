<app-data-table
  [rows]="rows()"
  [columns]="columns"
  [total]="2"
  [totalPages]="5"
  [page]="0"
  [pageSize]="1"
  [pageWindowSize]="3"
  [trackBy]="trackRow"
  (sortChange)="sort.set($event)"
  (pageChange)="page.set($event)"
>
  <ng-template appDataTableCell="name" let-row>
    <strong>{{ row.name }}</strong>
  </ng-template>
  <ng-template appDataTableHeader="custom"><span>Eigener Spaltenkopf</span></ng-template>
</app-data-table>
