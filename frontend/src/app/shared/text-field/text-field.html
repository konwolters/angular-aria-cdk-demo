<app-field-wrapper
  [label]="label()"
  [hideLabel]="hideLabel()"
  [required]="required()"
  [changed]="isChanged()"
  [changedLabel]="changedLabel()"
  [previousValueLabel]="previousValueLabel()"
  [previousValue]="originalValue()"
  [messagesId]="messagesId"
  [hint]="hint()"
  [errors]="errors()"
  [showErrors]="invalid() && touched() && !readonly()"
  [controlId]="messagesId + '-control'"
>
  <div
    class="flex w-full overflow-hidden rounded-control border border-border-strong shadow-sm focus-within:border-focus"
    [class.mt-1]="!hideLabel()"
    [class.h-8]="size() === 'small'"
    [class.h-control]="size() === 'medium'"
    [class.bg-surface]="!readonly()"
    [class.bg-surface-muted]="readonly()"
    [class.cursor-not-allowed]="readonly()"
  >
    @if (prefix()) {
      <span
        aria-hidden="true"
        class="inline-flex items-center border-r border-border bg-surface-subtle px-3 text-sm font-normal text-content-muted"
      >
        {{ prefix() }}
      </span>
    }
    <input
      [id]="messagesId + '-control'"
      [type]="type()"
      [value]="value()"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      [attr.maxlength]="maxLength()"
      [attr.aria-describedby]="messagesId"
      [readonly]="readonly()"
      [required]="required()"
      [tabindex]="readonly() ? -1 : null"
      [attr.aria-invalid]="invalid() ? 'true' : null"
      class="h-full min-w-0 flex-1 bg-transparent px-3 text-control font-normal text-content-secondary outline-none placeholder:text-content-subtle"
      [class.font-mono]="monospace()"
      [class.cursor-not-allowed]="readonly()"
      [class.opacity-50]="disabled()"
      (input)="updateValue($event)"
      (blur)="touch.emit()"
    />
  </div>
</app-field-wrapper>
