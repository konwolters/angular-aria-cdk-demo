<div class="block">
  <label class="block text-sm font-medium">
    <span class="flex items-center gap-2" [class.sr-only]="hideLabel()">
      <span>{{ label() }}</span>
      @if (isChanged()) {
        <span
          class="rounded bg-brand px-1.5 py-0.5 text-xs font-semibold tracking-wide text-on-brand"
        >
          {{ changedLabel() }}
        </span>
      }
    </span>
    <div
      class="mt-1 flex h-control w-full overflow-hidden rounded-control border border-border-strong focus-within:border-focus"
      [class.bg-surface]="!readonly()"
      [class.bg-surface-muted]="readonly()"
      [class.cursor-not-allowed]="readonly()"
    >
      @if (prefix()) {
        <span
          aria-hidden="true"
          class="inline-flex items-center border-r border-border bg-surface-subtle px-3 text-sm font-normal text-content-muted"
        >
          {{ prefix() }}
        </span>
      }
      <input
        [type]="type()"
        [value]="value()"
        [placeholder]="placeholder()"
        [disabled]="disabled()"
        [attr.maxlength]="maxLength()"
        [attr.aria-describedby]="messagesId"
        [readonly]="readonly()"
        [required]="required()"
        [tabindex]="readonly() ? -1 : null"
        [attr.aria-invalid]="invalid() ? 'true' : null"
        class="h-full min-w-0 flex-1 bg-transparent px-3 font-normal text-content-secondary outline-none"
        [class.cursor-not-allowed]="readonly()"
        [class.opacity-50]="disabled()"
        (input)="updateValue($event)"
        (blur)="touch.emit()"
      />
    </div>
  </label>
  <app-field-messages
    [id]="messagesId"
    [hint]="hint()"
    [errors]="errors()"
    [showErrors]="invalid() && touched() && !readonly()"
  />
  @if (isChanged()) {
    <span class="mt-1 block text-xs font-normal text-content-muted">
      {{ previousValueLabel() }}: {{ originalValue() }}
    </span>
  }
</div>
