<section class="space-y-6">
  <header>
    <h2 class="text-xl font-semibold tracking-tight">Teamhistorie</h2>
    <p class="mt-1 text-sm text-content-muted">
      Version 4 im Vergleich zu Version 3. Geänderte Felder sind markiert.
    </p>
  </header>

  <section class="rounded-card border border-border bg-surface p-5">
    <h3 class="text-base font-semibold">Grunddaten</h3>
    <div class="mt-5 grid gap-4 md:grid-cols-2">
      <app-text-field
        label="Teamname"
        [value]="'Customer Operations'"
        [initialValue]="'Customer Experience'"
        [changed]="true"
        [readonly]="true"
        previousValueLabel="Version 3"
      />
      <app-text-field
        label="Team-Kürzel"
        prefix="teams/"
        [value]="'customer-experience'"
        [initialValue]="'customer-experience'"
        [changed]="false"
        [readonly]="true"
        previousValueLabel="Version 3"
      />
      <app-textarea
        class="md:col-span-2"
        label="Beschreibung"
        [value]="'Unterstützt Kundinnen und Kunden bei Fragen zu unseren Produkten und Services.'"
        [initialValue]="'Unterstützt Kundinnen und Kunden bei Fragen zu unseren Produkten.'"
        [changed]="true"
        [readonly]="true"
        previousValueLabel="Version 3"
      />
    </div>
  </section>

  <section class="rounded-card border border-border bg-surface p-5">
    <h3 class="text-base font-semibold">Verantwortung</h3>
    <div class="mt-5 grid gap-4 md:grid-cols-2">
      <app-select
        label="Bereich"
        labelSize="medium"
        [options]="departmentOptions"
        [value]="'Operations'"
        [initialValue]="'Customer Success'"
        [changed]="true"
        [readonly]="true"
        previousValueLabel="Version 3"
      />
      <app-text-field
        label="Teamverantwortliche:r"
        type="email"
        [value]="'sam.taylor@example.com'"
        [initialValue]="'jordan.davis@example.com'"
        [changed]="true"
        [readonly]="true"
        previousValueLabel="Version 3"
      />
      <app-select
        label="Zeitzone"
        labelSize="medium"
        [options]="timezoneOptions"
        [value]="'Europe/London'"
        [initialValue]="'Europe/Berlin'"
        [changed]="true"
        [readonly]="true"
        previousValueLabel="Version 3"
      />
    </div>
  </section>

  <section class="rounded-card border border-border bg-surface p-5">
    <h3 class="text-base font-semibold">Zugriff und Benachrichtigungen</h3>
    <div class="mt-5 grid gap-4 md:grid-cols-2">
      <app-select
        label="Sichtbarkeit"
        labelSize="medium"
        [options]="visibilityOptions"
        [value]="'Private'"
        [initialValue]="'Private'"
        [changed]="false"
        [readonly]="true"
        previousValueLabel="Version 3"
      />
      <app-select
        label="Standardrolle"
        labelSize="medium"
        [options]="roleOptions"
        [value]="'Admin'"
        [initialValue]="'Member'"
        [changed]="true"
        [readonly]="true"
        previousValueLabel="Version 3"
      />
      <app-multi-select
        label="Servicebereiche"
        labelSize="medium"
        [options]="channelOptions"
        [value]="currentChannels"
        [initialValue]="previousChannels"
        [changed]="true"
        [readonly]="true"
        previousValueLabel="Version 3"
      />
    </div>
  </section>
</section>
