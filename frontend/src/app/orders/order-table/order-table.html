<section class="space-y-6">
  <header>
    <h1 class="text-2xl font-semibold tracking-tight">Bestellungen</h1>
    <p class="mt-1 text-sm text-content-muted">Prüfe Bestellstatus, Zahlungsart und Umsätze.</p>
  </header>

  <section class="rounded-card border border-border bg-surface">
    <app-data-table-toolbar (apply)="applyFilters()" (reset)="resetFilters()">
      <div data-table-searches>
        <app-text-field
          label="Bestellungen suchen"
          placeholder="Bestellnummer oder Kunde…"
          [(value)]="searchTerm"
        />
      </div>
      <div data-table-filters class="flex flex-wrap items-end gap-3">
        <div>
          <app-multi-select
            label="Bestellstatus"
            [options]="statusOptions"
            [(selected)]="selectedStatuses"
          />
        </div>
        <div>
          <app-multi-select
            label="Zahlungsart"
            [options]="paymentMethods"
            [(selected)]="selectedPaymentMethods"
          />
        </div>
      </div>
    </app-data-table-toolbar>

    <app-data-table
      [framed]="false"
      [rows]="rows()"
      [columns]="columns"
      [total]="total()"
      [totalPages]="totalPages()"
      [page]="result.value().number"
      [pageSize]="result.value().size"
      [sort]="query().sort"
      [direction]="query().direction"
      [loading]="loading()"
      [error]="error()"
      caption="Bestellungen: gefilterte Bestellpositionen"
      emptyMessage="Keine Bestellungen gefunden."
      [trackBy]="trackOrder"
      (sortChange)="toggleSort($event)"
      (pageChange)="setPage($event)"
      (pageSizeChange)="setPageSize($event)"
    >
      <ng-template appDataTableCell="status" let-order>
        <span
          class="rounded-pill px-2.5 py-1 text-xs font-medium"
          [class.bg-success-subtle]="order.status === 'Bezahlt'"
          [class.text-success]="order.status === 'Bezahlt'"
          [class.bg-warning-subtle]="order.status === 'Ausstehend'"
          [class.text-warning]="order.status === 'Ausstehend'"
          [class.bg-surface-muted]="order.status === 'Erstattet'"
          [class.text-content-secondary]="order.status === 'Erstattet'"
        >
          {{ order.status }}
        </span>
      </ng-template>
    </app-data-table>
  </section>
</section>
