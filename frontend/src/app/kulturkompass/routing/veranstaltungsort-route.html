<app-veranstaltungsort-detail-seite
  [tabs]="state.tabs()"
  [selected]="session.selected()"
  [(historical)]="state.historical"
  [(editing)]="state.editing"
  [editScope]="state.editScope()"
  [(activeTab)]="state.activeTab"
  [(name)]="state.name"
  [(customerNumber)]="session.customerNumber"
  [(status)]="session.status"
  [(bereichFilter)]="state.bereichFilter"
  [(bereichStatus)]="state.bereichStatus"
  [statuses]="ctx().statuses"
  [bereichs]="state.filteredBereichs()"
  [totalBereichs]="state.bereichs().length"
  [bereichColumns]="bereichColumns"
  [zusatzdaten]="session.bereichZusatzdaten()"
  [zusatzarten]="references.zusatzarten"
  [bereichOptions]="state.bereichOptions()"
  [angebot]="state.angebot()"
  [totalAngebot]="state.totalAngebot()"
  [angebotColumns]="angebotColumns"
  [historyRows]="history"
  [historyColumns]="historyColumns"
  (details)="ctx().showDetails($event.kind, $event.row)"
  (edit)="ctx().openEditor($event.kind, $event.row)"
  (beginEditing)="ctx().beginEditing($event)"
  (submit)="ctx().confirm('Zur Freigabe einreichen')"
/>
