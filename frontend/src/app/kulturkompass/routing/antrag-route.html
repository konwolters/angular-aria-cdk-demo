<app-antrag-seite
  [request]="session.selected()"
  [customer]="state.customer()"
  [comparison]="state.comparison"
  [tabs]="state.tabs()"
  [(selectedTab)]="state.requestTab"
  [statuses]="ctx().statuses"
  [bereichs]="state.bereichs()"
  [bereichColumns]="bereichColumns"
  [angebot]="state.angebot()"
  [angebotColumns]="angebotColumns"
  (details)="ctx().showRequestDiff($event.kind, $event.row)"
  (confirm)="ctx().confirm($event)"
  (edit)="ctx().editRequest()"
/>
