<div class="mt-5 grid gap-4 sm:grid-cols-2">
  @if (readonly()) {
    <app-text-field
      size="small"
      label="Bereich"
      [value]="value()?.['bereichnummer'] || ''"
      [readonly]="true"
      [changed]="false"
    />
  } @else {
    <app-select
      size="small"
      label="Bereich"
      [options]="bereichOptions() ?? bereichs"
      [value]="value()?.['bereichnummer'] || ''"
      [initialValue]="value()?.['bereichnummer'] || ''"
      [required]="true"
    />
  }
  <app-select
    size="small"
    label="Veranstaltungsart"
    [options]="businessTypes"
    [value]="value()?.['geschaeft'] || ''"
    [initialValue]="value()?.['geschaeft'] || ''"
    [changed]="readonly() ? false : undefined"
    [readonly]="readonly()"
    [required]="!readonly()"
  />
  <app-select
    size="small"
    label="Angebotsformat"
    [options]="securities"
    [value]="value()?.['wertpapier'] || ''"
    [initialValue]="value()?.['wertpapier'] || ''"
    [changed]="readonly() ? false : undefined"
    [readonly]="readonly()"
    [required]="!readonly()"
  />
  <app-text-field
    size="small"
    label="Angebotscode"
    [monospace]="true"
    [value]="value()?.['isin'] || ''"
    [initialValue]="value()?.['isin'] || ''"
    [changed]="readonly() ? false : undefined"
    [readonly]="readonly()"
    [maxLength]="12"
  />
  <app-select
    size="small"
    label="Land"
    [options]="countries"
    [value]="value()?.['land'] || ''"
    [initialValue]="value()?.['land'] || ''"
    [changed]="readonly() ? false : undefined"
    [readonly]="readonly()"
    [required]="!readonly()"
  />
  <app-text-field
    size="small"
    label="Kontaktcode Veranstaltungsort"
    [value]="value()?.['psetBic'] || ''"
    [initialValue]="value()?.['psetBic'] || ''"
    [changed]="readonly() ? false : undefined"
    [readonly]="readonly()"
    [maxLength]="11"
  />
</div>
<h3 class="mb-2 mt-5 text-sm font-semibold">Veranstaltungsbeteiligte</h3>
<app-data-table
  [tightCells]="true"
  minWidth="39rem"
  [rows]="participants()"
  [pagination]="false"
  [columns]="columns"
  caption="Veranstaltungsbeteiligte"
>
  <ng-template appDataTableCell="konto" let-row>
    <app-text-field
      size="small"
      [label]="'Kontakt-ID ' + row.name"
      class="w-full max-w-40"
      [hideLabel]="true"
      [value]="row.konto"
      [initialValue]="row.konto"
      [changed]="readonly() ? false : undefined"
      [readonly]="readonly()"
      [maxLength]="35"
    />
  </ng-template>
  <ng-template appDataTableCell="bic" let-row>
    <app-text-field
      size="small"
      [label]="'Kontaktcode ' + row.name"
      class="w-full max-w-40"
      [hideLabel]="true"
      [value]="row.bic"
      [initialValue]="row.bic"
      [changed]="readonly() ? false : undefined"
      [readonly]="readonly()"
      [maxLength]="11"
    />
  </ng-template>
  <ng-template appDataTableCell="pc" let-row>
    <app-text-field
      size="small"
      [label]="'PC ' + row.name"
      class="w-full max-w-40"
      [hideLabel]="true"
      [value]="row.pc"
      [initialValue]="row.pc"
      [changed]="readonly() ? false : undefined"
      [readonly]="readonly()"
      [maxLength]="34"
    />
  </ng-template>
  <ng-template appDataTableCell="bezeichnung" let-row>
    @if (row.hasName) {
      <app-text-field
        size="small"
        [label]="'Name ' + row.name"
        class="w-full max-w-40"
        [hideLabel]="true"
        [value]="row.bezeichnung"
        [initialValue]="row.bezeichnung"
        [changed]="readonly() ? false : undefined"
        [readonly]="readonly()"
        [maxLength]="35"
      />
    } @else {
      —
    }
  </ng-template>
</app-data-table>
<div class="mt-4">
  <app-textarea
    size="small"
    label="Zusatzinformationen"
    [value]="value()?.['zusatzinfo'] || ''"
    [initialValue]="value()?.['zusatzinfo'] || ''"
    [changed]="readonly() ? false : undefined"
    [readonly]="readonly()"
    [maxLength]="255"
  />
</div>
