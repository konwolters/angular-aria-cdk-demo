@let result = results.hasValue() ? results.value() : undefined;

<app-angebot-detail [(open)]="detailsOpen" [value]="detailRow()" title="Angebotsdetail" />

<div class="flex min-h-8 flex-wrap items-center justify-between gap-3 px-5">
  <h1 class="text-lg font-semibold text-brand-strong">Angebotssuche</h1>
</div>
<section class="bg-surface">
  <app-data-table-toolbar
    [compactTop]="true"
    [showApply]="false"
    [showReset]="false"
    (apply)="apply()"
    (reset)="reset()"
  >
    <div data-table-searches class="w-full">
      <section aria-labelledby="angebot-customer-filters">
        <h2
          id="angebot-customer-filters"
          class="mb-2 text-xs font-semibold uppercase tracking-wide text-content-muted"
        >
          Veranstaltungsort und Bereich
        </h2>
        <div class="grid grid-cols-[repeat(auto-fill,minmax(min(100%,12rem),1fr))] items-end gap-3">
          <app-text-field label="Veranstaltungsort" [formField]="searchForm.name" />
          <app-text-field
            label="Standortnummer"
            [formField]="searchForm.kundennummer"
          />
          <app-text-field label="Registerkennung" [formField]="searchForm.lei" />
          <app-text-field
            label="Bereichsnummer"
            [formField]="searchForm.bereichnummer"
          />
        </div>
      </section>
      <section aria-labelledby="angebot-characteristic-filters" class="mt-4">
        <h2
          id="angebot-characteristic-filters"
          class="mb-2 text-xs font-semibold uppercase tracking-wide text-content-muted"
        >
          Angebotsmerkmale
        </h2>
        <div class="grid grid-cols-[repeat(auto-fill,minmax(min(100%,12rem),1fr))] items-end gap-3">
          <app-multi-select
            [fullWidth]="true"
            label="Land"
            [options]="['DE', 'LU', 'US']"
            [formField]="searchForm.land"
            [changed]="false"
          />
          <app-multi-select
            [fullWidth]="true"
            label="Veranstaltungsart"
            [options]="['Workshop', 'Ausstellung']"
            [formField]="searchForm.geschaeft"
            [changed]="false"
          />
          <app-multi-select
            [fullWidth]="true"
            label="Angebotsformat"
            [formField]="searchForm.wertpapier"
            [options]="['Präsenz', 'Online']"
            [changed]="false"
          />
          <app-text-field
            label="Angebotscode"
            [formField]="searchForm.isin"
            [monospace]="true"
          />
          <app-text-field
            label="Kontaktcode Ansprechperson"
            [formField]="searchForm.agentBic"
          />
          <app-text-field
            label="Kontakt-ID Ansprechperson"
            [formField]="searchForm.konto"
          />
          <app-text-field
            label="Kontaktcode Veranstaltungsteam"
            [formField]="searchForm.bic"
          />
          <app-text-field
            label="Zusatzinformationen"
            [formField]="searchForm.zusatzinfo"
          />
        </div>
      </section>
    </div>
    <div data-table-summary class="flex flex-wrap items-center justify-between gap-3">
      <span>{{ result?.page.totalElements ?? 0 }} Treffer</span>
      <div class="flex flex-wrap justify-end gap-3">
        <button appButton type="submit">Suchen</button>
        <button
          appButton
          type="button"
          variant="secondary"
          icon="refresh"
          (click)="reset()"
        >
          Zurücksetzen</button
        ><button
          appButton
          variant="secondary"
          type="button"
          [disabled]="true"
          title="CSV-Export wird später über das Backend bereitgestellt"
        >
          CSV exportieren
        </button>
      </div>
    </div>
  </app-data-table-toolbar>
  <app-data-table
    [framed]="false"
    [rows]="result?.content ?? []"
    [total]="result?.page.totalElements ?? 0"
    [totalPages]="result?.page.totalPages ?? 0"
    [page]="result?.page.number ?? 0"
    [pageSize]="result?.page.size ?? tableQuery().size"
    [loading]="results.isLoading()"
    [error]="results.error() ? 'Suchergebnisse konnten nicht geladen werden.' : null"
    (pageChange)="setPage($event)"
    (pageSizeChange)="setPageSize($event)"
    [columns]="columns"
    caption="Suchergebnisse"
  >
    <ng-template appDataTableCell="isin" let-row
      ><span class="font-mono">{{ row.isin }}</span></ng-template
    >
    <ng-template appDataTableCell="antrag" let-row>
      @if (row.antrag === 'Ja') {
        <button appButton variant="link" type="button" (click)="openRequest(row)">
          Ja
        </button>
      } @else {
        {{ row.antrag }}
      }
    </ng-template>
    <ng-template appDataTableCell="action" let-row
      ><button appButton variant="link" type="button" (click)="openDetails(row)">
        Details
      </button></ng-template
    >
  </app-data-table>
</section>
