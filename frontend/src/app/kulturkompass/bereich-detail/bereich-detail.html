<div class="mt-5 grid gap-4 sm:grid-cols-2">
  <app-text-field
    size="small"
    label="Bereichsnummer"
    [required]="editing() && editScope() !== 'angebot'"
    [value]="value()?.['bereichnummer'] || ''"
    [readonly]="!editing() || editScope() === 'angebot'"
  />
  <app-text-field
    size="small"
    label="Bezeichnung"
    [required]="editing() && editScope() !== 'angebot'"
    [value]="value()?.['bezeichnung'] || ''"
    [readonly]="!editing() || editScope() === 'angebot'"
  />
  <app-select
    size="small"
    label="Status"
    [required]="editing() && editScope() !== 'angebot'"
    [options]="statuses()"
    value="aktiv"
    [readonly]="!editing() || editScope() === 'angebot'"
  />
</div>
<div class="mt-4"><app-textarea size="small" label="Kommentar" [readonly]="!editing()" /></div>
<h3 class="mb-2 mt-5 text-sm font-semibold">Zusatzdaten</h3>
<app-data-table
  [compact]="true"
  layout="fixed"
  [rows]="visibleZusatzdaten()"
  [columns]="columns()"
  [trackBy]="trackZusatzdatum"
  [pagination]="false"
  caption="Zusatzdaten"
  emptyMessage="Keine Zusatzdaten erfasst."
>
  <ng-template appDataTableHeader="art">
    Art
    @if (editing()) {
      <span aria-hidden="true">*</span>
    }
  </ng-template>
  <ng-template appDataTableHeader="wert">
    Wert
    @if (editing()) {
      <span aria-hidden="true">*</span>
    }
  </ng-template>
  <ng-template appDataTableCell="art" let-row>
    @if (editing()) {
      <app-select
        label="Art"
        [hideLabel]="true"
        [required]="true"
        [options]="zusatzarten()"
        [value]="row.art"
        [changed]="false"
        (valueChange)="updateZusatzdatum(row.id, 'art', $event)"
      />
    } @else {
      {{ row.art }}
    }
  </ng-template>
  <ng-template appDataTableCell="wert" let-row>
    @if (editing()) {
      <app-text-field
        label="Wert"
        [hideLabel]="true"
        [required]="true"
        [maxLength]="255"
        [value]="row.wert"
        [changed]="false"
        (valueChange)="updateZusatzdatum(row.id, 'wert', $event)"
      />
    } @else {
      {{ row.wert }}
    }
  </ng-template>
  <ng-template appDataTableCell="beschreibung" let-row>
    @if (editing()) {
      <app-text-field
        label="Beschreibung"
        [hideLabel]="true"
        [maxLength]="255"
        [value]="row.beschreibung"
        [changed]="false"
        (valueChange)="updateZusatzdatum(row.id, 'beschreibung', $event)"
      />
    } @else {
      {{ row.beschreibung }}
    }
  </ng-template>
  <ng-template appDataTableCell="action" let-row>
    @if (editing()) {
      <button
        appButton
        size="small"
        variant="link"
        type="button"
        (click)="removeZusatzdatum(row.id)"
      >
        Entfernen
      </button>
    }
  </ng-template>
</app-data-table>
@if (zusatzdaten().length > 2) {
  <button
    appButton
    size="small"
    variant="link"
    type="button"
    [attr.aria-expanded]="zusatzdatenExpanded()"
    (click)="zusatzdatenExpanded.set(!zusatzdatenExpanded())"
  >
    {{
      zusatzdatenExpanded()
        ? 'Weniger anzeigen'
        : '+ ' + (zusatzdaten().length - 2) + ' weitere anzeigen'
    }}
  </button>
}
@if (editing()) {
  <div class="mt-2 flex justify-end">
    <button appButton size="small" variant="secondary" type="button" (click)="addZusatzdatum()">
      Eintrag hinzufügen
    </button>
  </div>
}
