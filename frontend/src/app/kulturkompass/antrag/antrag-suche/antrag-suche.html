@let result = results.hasValue() ? results.value() : undefined;

<div class="flex min-h-8 flex-wrap items-center justify-between gap-3 px-5">
  <h1 class="text-lg font-semibold text-brand-strong">Staging & Freigaben</h1>
</div>
<section class="bg-surface">
  <app-data-table-toolbar
    [compactTop]="true"
    [showApply]="false"
    [showReset]="false"
    (apply)="apply()"
    (reset)="reset()"
  >
    <div data-table-searches class="w-full">
      <div
        class="grid grid-cols-[repeat(auto-fill,minmax(min(100%,11rem),1fr))] items-end gap-3"
      >
        <app-text-field label="Antrag" [formField]="searchForm.id" />
        <app-text-field label="Standortnummer" [formField]="searchForm.kundennummer" />
        <app-text-field
          label="Bereichsnummer"
          [formField]="searchForm.bereichnummer"
        />
        <app-multi-select
          [fullWidth]="true"
          label="Status"
          [options]="['In Bearbeitung', 'Eingereicht']"
          [formField]="searchForm.status"
          [changed]="false"
        />
        <app-multi-select
          [fullWidth]="true"
          label="Änderungsumfang"
          [formField]="searchForm.bereich"
          [options]="['Veranstaltungsort & Bereiche', 'Angebote', 'Referenzdaten']"
          [changed]="false"
        />
      </div>
    </div>
    <div data-table-summary class="flex flex-wrap items-center justify-between gap-3">
      <span>{{ result?.page.totalElements ?? 0 }} Einträge</span>
      <div class="flex flex-wrap justify-end gap-3">
        <button appButton type="submit">Suchen</button>
        <button
          appButton
          type="button"
          variant="secondary"
          icon="refresh"
          (click)="reset()"
        >
          Zurücksetzen
        </button>
      </div>
    </div>
  </app-data-table-toolbar>
  <app-data-table
    [framed]="false"
    [rows]="result?.content ?? []"
    [total]="result?.page.totalElements ?? 0"
    [totalPages]="result?.page.totalPages ?? 0"
    [page]="result?.page.number ?? 0"
    [pageSize]="result?.page.size ?? tableQuery().size"
    [loading]="results.isLoading()"
    [error]="results.error() ? 'Änderungsanträge konnten nicht geladen werden.' : null"
    (pageChange)="setPage($event)"
    (pageSizeChange)="setPageSize($event)"
    [columns]="columns"
    caption="Änderungsanträge"
  >
    <ng-template appDataTableCell="action" let-row
      ><button appButton variant="link" type="button" (click)="openAntrag(row)">
        Prüfen
      </button></ng-template
    >
  </app-data-table>
</section>
